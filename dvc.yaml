# Reproducible pipeline DAG. Run with `dvc repro`.

stages:
  data_ingestion:
    cmd: python -m vertebral.pipeline.stage_01_data_ingestion
    deps:
      - src/vertebral/pipeline/stage_01_data_ingestion.py
      - src/vertebral/components/data_ingestion.py
      - "data/raw/Part1 - Normal.csv"
      - "data/raw/Part1 - Type_H.csv"
      - "data/raw/Part1 - Type_S.csv"
    outs:
      - artifacts/data_ingestion/vertebral.csv

  data_validation:
    cmd: python -m vertebral.pipeline.stage_02_data_validation
    deps:
      - src/vertebral/pipeline/stage_02_data_validation.py
      - src/vertebral/components/data_validation.py
      - artifacts/data_ingestion/vertebral.csv
      - schema.yaml
    outs:
      - artifacts/data_validation/status.json:
          cache: false

  data_transformation:
    cmd: python -m vertebral.pipeline.stage_03_data_transformation
    deps:
      - src/vertebral/pipeline/stage_03_data_transformation.py
      - src/vertebral/components/data_transformation.py
      - artifacts/data_ingestion/vertebral.csv
      # Gate training on validation, and track the feature contract so a schema
      # change regenerates the preprocessor/model/metrics.
      - artifacts/data_validation/status.json
      - schema.yaml
    params:
      - data_transformation.test_size
      - data_transformation.random_state
    outs:
      - artifacts/data_transformation/train.csv
      - artifacts/data_transformation/test.csv
      - artifacts/data_transformation/preprocessor.joblib
      - artifacts/data_transformation/label_encoder.joblib

  model_trainer:
    cmd: python -m vertebral.pipeline.stage_04_model_trainer
    deps:
      - src/vertebral/pipeline/stage_04_model_trainer.py
      - src/vertebral/components/model_trainer.py
      - artifacts/data_transformation/train.csv
      - artifacts/data_transformation/preprocessor.joblib
    params:
      - model_trainer.n_neighbors
      - model_trainer.weights
      - model_trainer.metric
      - model_trainer.p
    outs:
      - artifacts/model_trainer/model.joblib

  model_evaluation:
    cmd: python -m vertebral.pipeline.stage_05_model_evaluation
    deps:
      - src/vertebral/pipeline/stage_05_model_evaluation.py
      - src/vertebral/components/model_evaluation.py
      - artifacts/data_transformation/test.csv
      - artifacts/data_transformation/label_encoder.joblib
      - artifacts/model_trainer/model.joblib
    params:
      - model_evaluation.average
    metrics:
      - artifacts/model_evaluation/metrics.json:
          cache: false
